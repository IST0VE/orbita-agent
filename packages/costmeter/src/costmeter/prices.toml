# Тарифы провайдеров, $ за 1M токенов.
#
# Четыре статьи на модель:
#   input       — вход, посчитанный заново (он же cache miss);
#   cache_read  — вход, отданный из кеша;
#   cache_write — вход, записанный в кеш (у Anthropic дороже обычного,
#                 у DeepSeek такой статьи нет — 0);
#   output      — генерация.
#
# Цены устаревают, поэтому дата снятия лежит прямо здесь. Модели нет в
# таблице — CostMeter предупредит и посчитает ноль, а не подставит чужой
# тариф. Добавить модель — это четыре строки ниже, а не правка кода.

[meta]
captured = "2026-08-29"
currency = "USD"
unit = "за 1M токенов"
policy = "peak"

# --------------------------------------------------------------------------
# DeepSeek
# --------------------------------------------------------------------------
# С 2026-08-16 DeepSeek тарифицирует peak/off-peak по времени UTC. Состояние
# Orbita агрегирует токены за весь тред без времени каждого вызова, поэтому
# безопасный дефолт — пиковая (максимальная) ставка: лимит бюджета никогда не
# будет занижен. Для гарантированно off-peak нагрузки переопределите PRICE_*.
# Источник: https://api-docs.deepseek.com/quick_start/pricing/
[prices.deepseek."deepseek-v4-flash"]
input = 0.44
cache_read = 0.014
cache_write = 0.0
output = 1.32

# --------------------------------------------------------------------------
# Остальные модели
# --------------------------------------------------------------------------
# Здесь намеренно пусто. Тариф, вписанный по памяти, хуже отсутствующего:
# отсутствующий даёт предупреждение и ноль, а выдуманный — уверенный
# неверный счёт. Сверьтесь с прайсом провайдера и допишите блок вида:
#
#   [prices.anthropic."claude-sonnet-5"]
#   input = ...
#   cache_read = ...
#   cache_write = ...
#   output = ...
