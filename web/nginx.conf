# Собранный фронт и API на одном origin — повторение `server.proxy` из
# vite.config.ts для готовой сборки. Список путей обязан совпадать с PROXIED
# оттуда: путь, которого здесь нет, уйдёт в index.html и вернётся браузеру
# HTML-страницей вместо JSON. Совпадение проверяет tests/test_one_command.py.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    # Адрес backend перечитывается у DNS Docker. Имя, разрешённое один раз при
    # старте, после пересоздания контейнера agent вело бы на его старый IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agent http://agent:2024;

    location ~ ^/(api|assistants|threads|runs|info|ok|store)(/|$) {
        # Переменная без URI: путь и запрос уходят к backend как есть.
        proxy_pass $agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Прогоны отдают поток событий. С буфером nginx копил бы его и
        # показывал этапы пачкой в конце, а минута тишины между событиями —
        # обычное дело для долгой роли — обрывала бы соединение.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Размер тела ограничивает сам API (API_MAX_REQUEST_BYTES); второй
        # лимит здесь молча расходился бы с настройкой в .env.
        client_max_body_size 0;
    }

    # Имена файлов сборки содержат хеш содержимого — их можно кешировать.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # А index.html — нет: после пересборки старая копия ссылалась бы на
    # удалённые файлы, и интерфейс открывался бы белым экраном.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
