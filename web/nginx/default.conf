# Штатный Compose: интерфейс и API на 8080, наружу — только на петлю
# (docker-compose.yml). В серверном режиме этот файл заменяет server.conf.
server {
    listen 8080;
    server_name _;
    # Страница открыта по http://localhost: HSTS здесь не нужен (headers.conf).
    set $orbita_hsts "";
    include /etc/nginx/orbita/app.conf;
}
