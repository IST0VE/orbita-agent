# Заголовки безопасности для страниц, которые отдаёт сам nginx: сборки фронта
# и index.html. Включается в каждый такой location, а не на уровне server:
# `add_header` внутри location отменяет все унаследованные, и /assets/ с
# /index.html (у них свой Cache-Control) остались бы без защиты. API сюда не
# входит — свои заголовки ставит агент (security.ApiSecurityMiddleware), —
# и Keycloak под /auth/ тоже: его консоль сама встраивает свои страницы во фрейм.
#
# Политика документа (web/build/csp.ts) лежит в <meta>, а `frame-ancestors`
# браузер из <meta> не читает. Без этого заголовка интерфейс можно открыть в
# невидимом фрейме чужой страницы и подсунуть оператору клик по «Опубликовать».
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Пустое значение nginx не отправляет: на петле (default.conf) HSTS нет, а в
# серверном режиме (server.conf) адрес снаружи всегда https.
add_header Strict-Transport-Security $orbita_hsts always;
