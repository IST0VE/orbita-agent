# Серверный режим (docker-compose.server.yml): заменяет default.conf. Тот же
# интерфейс и API на 8080 плюс Keycloak под /auth на том же имени.
#
# TLS здесь нет: его снимает корпоративный прокси с сертификатом домена и
# передаёт сюда запросы по HTTP. Браузер при этом видит https — без него вход
# не работает вовсе: PKCE считает SHA-256 через crypto.subtle, а браузер даёт
# его только https-страницам и localhost (web/src/oidc.ts).
server {
    listen 8080;
    server_name _;

    # Снаружи адрес всегда https (ORBITA_PUBLIC_URL): браузер запомнит это и
    # не пойдёт на домен по открытому HTTP даже по старой ссылке. Без
    # includeSubDomains — соседние сайты компании на поддоменах не наши.
    set $orbita_hsts "max-age=31536000";

    include /etc/nginx/orbita/app.conf;

    # Путь совпадает с KC_HTTP_RELATIVE_PATH, поэтому уходит к Keycloak как есть.
    set $keycloak http://keycloak:8080;

    location = /auth {
        return 301 /auth/;
    }

    # ^~: найденный префикс отменяет поиск по регулярным location, и путь API
    # из app.conf — как и любой будущий регулярный — адреса Keycloak не заберёт.
    location ^~ /auth/ {
        proxy_pass $keycloak;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Keycloak верит этим заголовкам (KC_PROXY_HEADERS=xforwarded), поэтому
        # они ставятся здесь, а не передаются от прокси как пришли. Адрес
        # снаружи всегда https (ORBITA_PUBLIC_URL), хотя сюда запрос пришёл по
        # HTTP: по схеме Keycloak ставит cookie флаг Secure и решает, пускать
        # ли запрос при sslRequired.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        # Адрес клиента — из заголовка корпоративного прокси, если он его
        # ставит; нужен журналу Keycloak, права от него не зависят.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Ответы входа несут длинные cookie сессии; буфера по умолчанию
        # (4–8 КБ) на них кончаются, и nginx отвечает 502 «too big header».
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
