# Orbita целиком: веб-интерфейс на :8080, агент на :2024 и runner НТ с k6.
#
#     up.cmd / ./up.sh             то же, что ниже, плюс проверка .env и секретов
#     docker compose up -d --build --wait
#                                  интерфейс http://localhost:8080, Studio — :2024
#     docker compose run --rm demo три хода демо с постоянными чекпоинтами
#
# Ключ модели берётся из окружения или из .env рядом с этим файлом; без него
# сервер поднимется, но на первом же ходе ответит ошибкой авторизации.
#
# Что где хранится. Сервер разработки (`langgraph dev`) держит треды сам, в
# своей папке — это том `threads`. Postgres — база самого приложения: личные
# подключения Jira и Confluence каждого пользователя (зашифрованы ключом
# USER_SECRETS_KEY из .env) и чекпоинты профиля `demo`. Том — `pgdata`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orbita
      # Пароль задаётся один раз — при создании тома pgdata. Сменить его потом
      # правкой .env нельзя: база его уже не спросит, а агент придёт с новым.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random POSTGRES_PASSWORD (letters and digits) in .env}
      POSTGRES_DB: orbita
    ports:
      # Только петля: агенту, запущенному без Docker (docs/GETTING_STARTED.md).
      # Не 5432 — на машине разработчика он часто занят своим PostgreSQL.
      - "127.0.0.1:${ORBITA_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Агент и демо стартуют только после того, как база начала отвечать:
    # иначе первое же обращение упадёт на пустом месте.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbita -d orbita"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent:
    build: .
    # Имя образа общее с runner: собирается он один раз, здесь. Две
    # одинаковые сборки параллельно роняли BuildKit на экспорте (EOF), и
    # запуск падал через раз — ровно тогда, когда образ менялся.
    image: orbita-agent:local
    init: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    ports:
      # Служебные роуты меняют .env и читают материалы задач, а встроенные
      # роуты LangGraph запускают платные LLM-вызовы. Наружу порт открывают
      # только через аутентифицирующий reverse proxy.
      - "127.0.0.1:2024:2024"
    # required: false — чтобы `docker compose up` работал на чистой машине,
    # где .env ещё не создан.
    env_file:
      - path: .env
        required: false
    environment:
      # Пробрасывается, если задан снаружи; иначе значение приедет из .env.
      LLM_API_KEY: ${LLM_API_KEY:-}
      # База — сервис этого же файла; в .env записан адрес для запуска без Docker.
      POSTGRES_URI: postgresql://orbita:${POSTGRES_PASSWORD:?Set a random POSTGRES_PASSWORD (letters and digits) in .env}@postgres:5432/orbita
      # Runner — сервис этого же файла. Адрес задан здесь, а не в .env: там
      # записан 127.0.0.1 для запуска без Docker, а из контейнера это сам агент.
      NT_RUNNER_URL: http://runner:8077
      NT_RUNNER_TOKEN: ${NT_RUNNER_TOKEN:?Set a random NT_RUNNER_TOKEN (16+ characters) in .env}
      # Пути хранения задаются здесь, а не в образе. `env_file` перекрывает ENV
      # образа, и строка PUBLISH_DIR=published из личного .env уводила документы
      # в файловую систему контейнера — туда, где их стирает пересоздание.
      # Значение из `environment` сильнее `env_file`, поэтому пути однозначны.
      PUBLISH_DIR: /data/published
      AGENT_INPUT_DIR: /data/input
      JIRA_JOURNAL_PATH: /data/jira-operations.sqlite3
      # Страница «Настройки» правит .env хоста, смонтированный ниже. Процесс
      # берёт значения не из него, а из env_file при создании контейнера, и
      # `restart` их не перечитывает: сохранённое применяет `docker compose up -d`,
      # который сам пересоздаёт сервисы с изменившимся окружением.
      SETTINGS_ENV_FILE: /host/.env
      SETTINGS_APPLY_HINT: выполните на машине docker compose up -d (или up.cmd / up.sh)
      # Настройки, которые этот блок задаёт сам, а не берёт из .env: в
      # интерфейсе они закрыты, иначе правка молча ничего бы не меняла.
      # Список обязан совпадать с блоком — это проверяет test_settings_in_docker.
      SETTINGS_FIXED: POSTGRES_URI,NT_RUNNER_URL,PUBLISH_DIR,AGENT_INPUT_DIR,JIRA_JOURNAL_PATH
    volumes:
      - data:/data
      # Не /app/.env: `langgraph dev` загружает ./.env поверх окружения, и
      # личные PUBLISH_DIR и NT_RUNNER_URL перебили бы пути и адрес выше.
      # create_host_path: false — без .env Docker создал бы на хосте папку
      # `.env`, и после этого не запустилось бы ничего.
      - type: bind
        source: ./.env
        target: /host/.env
        bind:
          create_host_path: false
      # Материалы задач — с хоста: их кладёт человек, и терять их вместе с
      # контейнером незачем. Запись нужна кнопке «новая папка» в интерфейсе;
      # если папки заводят только на хосте, добавьте `:ro`.
      - ./input:/data/input
      # Своё хранилище `langgraph dev`. Postgres рядом его не заменяет: сервер
      # разработки держит треды сам и в свою папку. Без этого тома пересоздание
      # контейнера стирает историю тредов, а документы в `data` остаются —
      # и выглядит это как выборочная потеря.
      - threads:/app/.langgraph_api
    # Prometheus, InfluxDB, Jira или модель, запущенные на этой же машине,
    # доступны из контейнера по host.docker.internal, а не по 127.0.0.1.
    # Docker Desktop знает это имя сам; строка ниже нужна Docker Engine на Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    # `/ok` закрыт тем же токеном, что и весь API. Проверка с токеном заодно
    # подтверждает, что API_ADMIN_TOKEN задан и принят: с пустым сервер отвечает
    # 503, и `up --wait` сообщит об этом, а не откроет интерфейс, который
    # отказывает на каждом запросе.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as r; r.urlopen(r.Request('http://127.0.0.1:2024/ok', headers={'Authorization': 'Bearer ' + os.environ.get('API_ADMIN_TOKEN', '')}), timeout=5)"
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 180s
      start_interval: 3s

  # Собранный фронт и прокси к агенту на одном адресе. Порт хоста меняется
  # переменной ORBITA_WEB_PORT — в окружении или в .env.
  web:
    build: ./web
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    ports:
      # Та же граница, что у агента: наружу только через reverse proxy с TLS.
      - "127.0.0.1:${ORBITA_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    depends_on:
      agent:
        condition: service_healthy

  # Runner нагрузочного тестирования для сценария `nt_run`: тот же образ, своя
  # точка входа и k6 внутри. Порт наружу не опубликован — управляющий API
  # запускает нагрузку, и достучаться до него может только агент по сети
  # Compose, с тем же bearer-токеном.
  runner:
    # Образ агента: его собирает сервис agent. Без `never` Compose на чистой
    # машине сперва пытался скачать локальное имя и печатал «pull access denied».
    image: orbita-agent:local
    pull_policy: never
    # init обязателен: runner запускает воркер k6 отдельным процессом, и без
    # init его завершившиеся потомки оставались бы зомби.
    init: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    command:
      - python
      - scripts/serve_nt_runner.py
      - --host
      - 0.0.0.0
      - --config
      - config/nt-runner.json
      - --root
      - /data/nt-runs
      # В личном config/nt-runner.json k6_binary обычно указывает путь на хосте.
      - --k6-binary
      - /usr/local/bin/k6
      # Цели на localhost из того же файла ведут на хост, а не в контейнер.
      - --loopback-alias
      - host.docker.internal
    env_file:
      - path: .env
        required: false
    environment:
      NT_RUNNER_TOKEN: ${NT_RUNNER_TOKEN:?Set a random NT_RUNNER_TOKEN (16+ characters) in .env}
    volumes:
      # Список разрешённых стендов правит человек на хосте; после правки —
      # `docker compose restart runner`.
      - ./config:/app/config:ro
      - nt-runs:/data/nt-runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as r; r.urlopen(r.Request('http://127.0.0.1:8077/capabilities', headers={'Authorization': 'Bearer ' + os.environ.get('NT_RUNNER_TOKEN', '')}), timeout=5)"
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Локальный Keycloak для входа пользователей по OIDC — замена корпоративного,
  # пока его нет. Профиль: без OIDC_ISSUER в .env он никому не нужен.
  #     docker compose --profile auth up -d
  # или COMPOSE_PROFILES=auth в .env — тогда его поднимает и up.cmd / up.sh.
  # Консоль: http://localhost:8180/admin. Realm `orbita` с клиентом и
  # тестовыми пользователями импортируется из config/keycloak/import при
  # старте; start-dev держит данные в контейнере, и пересоздание возвращает
  # realm к файлу. Страницы входа — тема config/keycloak/themes/orbita в стиле
  # веб-интерфейса; start-dev её не кеширует, правки видны после F5.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Порт открыт только на петлю, поэтому пароль по умолчанию терпим.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Адрес, по которому Keycloak видит браузер. Он же `iss` в токенах, и
      # OIDC_ISSUER обязан с ним совпасть. Агент ходит за ключами и токенами
      # изнутри сети Compose: OIDC_JWKS_URL=http://keycloak:8080/realms/orbita/...
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./config/keycloak/import:/opt/keycloak/data/import:ro
      - ./config/keycloak/themes/orbita:/opt/keycloak/themes/orbita:ro
    # curl в образе нет; готовность спрашивается у порта управления bash'ем.
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Метрики и графики: Prometheus собирает /metrics агента, Grafana рисует доску
  # «Orbita» — деньги и токены, модель и окно шлюза, прогоны графов, Jira и
  # Confluence, сам сервер. Профиль, как у Keycloak:
  #     docker compose --profile monitoring up -d
  # или COMPOSE_PROFILES=monitoring в .env (через запятую с auth) — тогда их
  # поднимает и up.cmd / up.sh. Grafana: http://localhost:3000, доска открыта
  # без входа, править — admin / GRAFANA_ADMIN_PASSWORD. Prometheus:
  # http://localhost:9090. Что измеряется — docs/MONITORING.md.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["monitoring"]
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # /metrics агента закрыт, как весь API. METRICS_TOKEN открывает только его;
    # Prometheus читает токен из файла, а файл пишет эта точка входа.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${#METRICS_TOKEN}" -lt 16 ]; then
          echo "METRICS_TOKEN в .env пуст или короче 16 символов: /metrics агента закрыт. Запустите up.cmd / up.sh — они создадут токен — или впишите случайную строку сами." >&2
          exit 1
        fi
        printf '%s' "$$METRICS_TOKEN" > /tmp/metrics-token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=$${PROMETHEUS_RETENTION}
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Сколько дней держать ряды. Том `prometheus` растёт примерно на мегабайты
      # в день: рядов у агента сотни, а не миллионы.
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-30d}
    ports:
      - "127.0.0.1:${ORBITA_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s

  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["monitoring"]
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    environment:
      # Пароль задаётся при создании тома `grafana`; дальше его меняют в самой
      # Grafana. Порт открыт только на петлю, поэтому значение по умолчанию терпимо.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Смотреть доску можно без входа: это та же машина, что и сам агент.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/orbita.json
      # Grafana не ходит наружу за новостями, обновлениями и статистикой.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:${ORBITA_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    depends_on:
      prometheus:
        condition: service_healthy

  # Профиль, а не обычный сервис: `docker compose up` не должен тратить деньги
  # на вызовы модели без явной команды.
  demo:
    # Standalone `compose run demo` must also work before the first `up`.
    # A separate tag avoids competing exports when the full profile builds.
    build: .
    image: orbita-demo:local
    pull_policy: build
    init: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    profiles: ["demo"]
    command: ["python", "run_demo.py"]
    env_file:
      - path: .env
        required: false
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      CHECKPOINT_BACKEND: postgres
      POSTGRES_URI: postgresql://orbita:${POSTGRES_PASSWORD:?Set a random POSTGRES_PASSWORD (letters and digits) in .env}@postgres:5432/orbita
      PUBLISH_DIR: /data/published
      AGENT_INPUT_DIR: /data/input
      JIRA_JOURNAL_PATH: /data/jira-operations.sqlite3
    volumes:
      - data:/data
      - ./input:/data/input
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  data:
  # Журнал runner и файлы прогонов: сценарий, test.js, summary.json.
  nt-runs:
  # Треды сервера разработки. Отдельным томом, а не внутри `data`: у него свой
  # формат, своя версия и своя судьба при обновлении образа.
  threads:
  # Ряды Prometheus и база Grafana (пароль администратора, личные настройки).
  # Доска и источник данных в базе не живут — они приезжают из config/grafana.
  prometheus:
  grafana:
