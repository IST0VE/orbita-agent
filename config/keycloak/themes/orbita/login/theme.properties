# Тема входа Orbita для Keycloak: тот же тёплый фон, марка и элементы
# управления, что в веб-интерфейсе (web/src/styles). Разметка своя
# (template.ftl), формы страниц — из base; классы base-шаблонов
# переназначены ниже на классы orbita.css.
parent=base
import=common/keycloak

styles=css/orbita.css
locales=ru,en

kcHtmlClass=orb-html
kcBodyClass=orb-body
kcLoginClass=orb-page
kcFormCardClass=orb-card
kcFormHeaderClass=orb-card-head

kcFormClass=orb-form
kcFormGroupClass=orb-field
kcLabelClass=orb-label
kcLabelWrapperClass=orb-label-wrap
kcInputWrapperClass=orb-input-wrap
kcInputClass=orb-input
kcInputGroup=orb-input-group
kcInputErrorMessageClass=orb-field-error
kcInputHelperTextBeforeClass=orb-help
kcInputHelperTextAfterClass=orb-help
kcFormSettingClass=orb-options
kcFormOptionsClass=orb-options
kcFormOptionsWrapperClass=orb-options-links
kcFormButtonsClass=orb-buttons
kcContentWrapperClass=orb-content-row

kcButtonClass=orb-btn
kcButtonPrimaryClass=orb-btn-primary
kcButtonSecondaryClass=orb-btn-secondary
kcButtonDefaultClass=orb-btn-secondary
kcButtonBlockClass=orb-btn-block
kcButtonLargeClass=

kcFormPasswordVisibilityButtonClass=orb-reveal
kcFormPasswordVisibilityIconShow=orb-icon orb-icon-eye
kcFormPasswordVisibilityIconHide=orb-icon orb-icon-eye-off
kcResetFlowIcon=orb-icon orb-icon-restart

kcAlertClass=orb-alert
kcAlertTitleClass=orb-alert-text
kcFeedbackErrorIcon=orb-icon orb-icon-error
kcFeedbackWarningIcon=orb-icon orb-icon-warning
kcFeedbackSuccessIcon=orb-icon orb-icon-success
kcFeedbackInfoIcon=orb-icon orb-icon-info

kcSignUpClass=orb-info
kcInfoAreaWrapperClass=orb-info-wrap
