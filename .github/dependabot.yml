version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/packages/costmeter"
    schedule:
      interval: weekly
    groups:
      costmeter-python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
