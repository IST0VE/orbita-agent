# Публикация costmeter на PyPI по тегу.
#
# Запускается только вручную или тегом вида `costmeter-v0.1.0` — обычный push
# в ветку ничего никуда не отправляет. Версия в теге должна совпадать с версией
# в packages/costmeter/pyproject.toml, иначе job останавливается до сборки.
#
# Токенов в репозитории нет: используется доверенная публикация PyPI (OIDC).
# Перед первым релизом её надо один раз завести на стороне PyPI —
# https://pypi.org/manage/account/publishing/ — указав владельца, репозиторий,
# имя файла workflow (publish.yml) и окружение `pypi`.
name: publish costmeter

on:
  push:
    tags: ["costmeter-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Собрать и проверить, но не публиковать"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: сборка и проверка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install build twine

      # Тесты пакета гоняются его же зависимостями, без агента: если он
      # перестал быть самодостаточным, это должно всплыть здесь, а не у того,
      # кто поставит его из PyPI.
      - name: тесты пакета в изоляции
        working-directory: packages/costmeter
        run: |
          pip install -e ".[dev]"
          pytest

      - run: python -m build packages/costmeter
      - run: python -m twine check packages/costmeter/dist/*

      - name: версия в теге совпадает с версией пакета
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('packages/costmeter/pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#costmeter-v}"
          test "$version" = "$tag" || { echo "тег $tag против версии $version"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/costmeter/dist/

  publish:
    name: загрузка на PyPI
    needs: build
    if: vars.ENABLE_PYPI_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # доверенная публикация: токен выдаёт сам GitHub
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
