# Линтер и тесты на каждом push и pull request.
#
# Ни один тест не ходит в сеть и не требует ключей: LLM подменяется
# GenericFakeChatModel, Confluence — библиотекой responses. Поэтому секреты
# в workflow не нужны, и форки прогоняются так же, как основная ветка.
name: CI

on:
  push:
  pull_request:
  # Периодическая проверка истории: обезличивание файла не удаляет его прежние
  # версии из объектов репозитория, и на каждый коммит такую проверку не гоняют.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  costmeter:
    name: standalone costmeter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Library compatibility is checked separately from the application lock.
      - run: pip install "./packages/costmeter[dev]"
      - run: pip check
      - run: pytest
        working-directory: packages/costmeter

  check:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock

      # Та же команда, что в README: если установка сломается, это увидит CI,
      # а не человек, впервые клонировавший репозиторий. costmeter ставится
      # первым — он отдельный пакет, которого пока нет на PyPI.
      - run: pip install -r requirements.txt

      - run: ruff check .

      - run: pytest

  quality:
    name: quality evaluation
    runs-on: ubuntu-latest
    # Отдельно от тестов намеренно. Тесты отвечают, что код делает написанное;
    # набор — что получившийся документ годится для работы. Конвейер проходит
    # все проверки и при этом теряет ссылки на источники: одно другого не ловит.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install -r requirements.txt

      # Модель подделана и отвечает по сценарию случая: прогон детерминирован
      # и ничего не стоит. Живой прогон (--live) запускается руками.
      - run: python evals/run.py

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    # Правила распознавания общие с проверкой исходящих документов
    # (`agent.outgoing`): два набора шаблонов разошлись бы тихо. Значения
    # находок в лог не выводятся — лог CI доступен шире, чем исходный файл.
    steps:
      - uses: actions/checkout@v7
        with:
          # Для сравнения с базой и для проверки истории нужен не мелкий клон.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Общие правила импортируют конфигурацию приложения и требуют её зависимостей.
      - run: python -m pip install -r requirements.txt

      # Самопроверка: сканер обязан находить контрольную закладку. Без неё
      # «ничего не найдено» означает только то, что ничего не искали.
      - run: python scripts/scan_secrets.py --self-test --mode tree

      - name: changes against the base branch
        if: github.event_name == 'pull_request'
        run: python scripts/scan_secrets.py --mode changed --base origin/${{ github.base_ref }}

      - name: repository history
        if: github.event_name == 'schedule'
        run: python scripts/scan_secrets.py --mode history

  web:
    name: frontend build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # Тесты engine стояли в документации и не стояли в CI: они запускались
      # руками и потому не запускались. Сборка их не заменяет — она проверяет
      # типы и бюджет бандла, а порядок событий, окно нового прогона в том же
      # треде и набор действий fallback mode не проверяет ничем.
      - run: npm run test:engine
      - run: npm run build
      - run: npm audit --omit=dev

  browser:
    name: browser regressions
    runs-on: ubuntu-latest
    # Единственное место, где проверяется собранный интерфейс в настоящем
    # браузере: Markdown без выполнения скриптов, фокус в модальном окне,
    # гонка сохранения настроек, отказ публикаций и потеря связи. Ручным его
    # оставлять нельзя — в этом репозитории уже было видно, чем это кончается.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install -c requirements.lock -e ./packages/costmeter -e ".[uitest]"

      - run: python -m playwright install --with-deps chromium

      - run: python web/tests/browser_regressions.py

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke
          # Только снимки и лог браузера: профиль Chromium в артефакт не нужен.
          path: |
            .tmp/ui-smoke/*.png
            .tmp/ui-smoke/chromium.log
          retention-days: 7

  dependencies:
    name: python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install -r requirements.txt
      - run: pip-audit --local --skip-editable

  lock:
    name: clean install from the lock
    runs-on: ubuntu-latest
    # Зафиксированный набор проверяется установкой, а не чтением: файл, который
    # никто не ставит, расходится с pyproject первой же правкой зависимостей.
    # Здесь же ловится уязвимая транзитивная версия — ради неё файл и заведён.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install --upgrade pip pip-audit

      # Тот же порядок, что в Dockerfile: сначала закреплённый набор, затем
      # пакеты репозитория без повторного разрешения зависимостей.
      - run: pip install -r requirements.lock
      - run: pip install --no-deps ./packages/costmeter .

      # Набор обязан покрывать зависимости приложения: недостающее означает,
      # что lock устарел относительно pyproject.
      - run: pip check

      - run: pip-audit --local --skip-editable

      # Приложение должно подниматься на этом наборе, а не только ставиться.
      - run: python -c "import agent.graph, agent.api, costmeter"
